<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PVrajCMS Group</title>
<style>
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif; color:#f4f8ff; background:radial-gradient(circle at 15% 15%,rgba(0,174,239,.16),transparent 30%),radial-gradient(circle at 85% 80%,rgba(0,110,180,.18),transparent 32%),#061321; }
.topbar { min-height:78px; padding:10px 4%; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid rgba(255,255,255,.12); background:#071422; }
.brand { display:flex; align-items:center; gap:14px; min-width:0; }
.brand img { width:min(28vw,300px); max-height:62px; object-fit:contain; }
.tagline { border-left:1px solid rgba(255,255,255,.2); padding-left:14px; color:#d6e6f7; font-size:12px; white-space:nowrap; }
.back-link { color:#6bd5ff; text-decoration:none; font-weight:700; white-space:nowrap; }
.page { min-height:calc(100vh - 78px); display:grid; place-items:center; padding:38px 16px; }
.login-card { width:100%; max-width:460px; padding:36px; border:1px solid rgba(76,190,238,.28); border-radius:18px; background:linear-gradient(145deg,rgba(15,43,63,.97),rgba(7,23,38,.98)); box-shadow:0 22px 65px rgba(0,0,0,.35); }
.eyebrow { margin:0 0 10px; color:#43caff; font-size:11px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; }
h1 { margin:0; font-size:clamp(28px,5vw,35px); line-height:1.2; }
.intro { margin:12px 0 27px; color:#b9cde0; font-size:14px; line-height:1.65; }
.field { margin-bottom:18px; }
label { display:block; margin-bottom:7px; color:#e8f3ff; font-size:13px; font-weight:700; }
input[type="email"],input[type="password"] { width:100%; min-height:49px; padding:12px 14px; color:#fff; background:#071827; border:1px solid #29465d; border-radius:9px; outline:none; font-size:15px; }
input::placeholder { color:#7890a5; }
input:focus { border-color:#35bdf2; box-shadow:0 0 0 3px rgba(53,189,242,.13); }
.form-options { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 0 22px; }
.remember { display:inline-flex; align-items:center; gap:8px; color:#b9cde0; font-size:12px; }
.remember input { width:15px; height:15px; margin:0; accent-color:#13a9e4; }
a { color:#55ceff; text-decoration:none; }
.forgot { font-size:12px; font-weight:700; }
.login-btn { width:100%; min-height:51px; border:0; border-radius:9px; color:#fff; background:linear-gradient(135deg,#13b8ef,#075c9b); box-shadow:0 8px 22px rgba(5,112,177,.28); font-size:16px; font-weight:800; cursor:pointer; transition:.2s ease; }
.login-btn:hover { background:linear-gradient(135deg,#38ccff,#0879bd); box-shadow:0 10px 25px rgba(5,130,200,.38); transform:translateY(-2px); }
.login-btn:focus-visible { outline:3px solid #65d6ff; outline-offset:3px; }
.login-btn:disabled { opacity:.65; cursor:wait; transform:none; }
.signup { margin:22px 0 0; color:#b9cde0; text-align:center; font-size:13px; }
.notice { margin:19px 0 0; padding:10px 12px; color:#9db6ca; background:rgba(255,255,255,.045); border-radius:8px; font-size:11px; line-height:1.5; text-align:center; }
.notice.success { color:#9df2c0; background:rgba(30,160,90,.12); }
.notice.error { color:#ffb4b4; background:rgba(200,40,40,.12); }
@media(max-width:600px) { .topbar { min-height:66px; padding:9px 14px; } .brand { gap:0; } .brand img { width:min(55vw,220px); max-height:52px; } .tagline { display:none; } .page { min-height:calc(100vh - 66px); padding:22px 13px; } .login-card { padding:27px 20px; border-radius:14px; } .intro { margin-bottom:23px; } }
@media(max-width:350px) { .back-link { font-size:13px; } .brand img { width:48vw; } .form-options { align-items:flex-start; flex-direction:column; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.png" alt="PVrajCMS Group"><span class="tagline">Engineering • Technology • Digital Innovation</span></a>
  <a class="back-link" href="index.html">← Back to Website</a>
</header>
<main class="page">
<section class="login-card">
  <p class="eyebrow">PVrajCMS Group Account</p>
  <h1>Welcome Back</h1>
  <p class="intro">Login with your registered email address to access PVrajCMS Group services.</p>
  <form id="loginForm">
    <div class="field"><label for="loginEmail">Email Address</label><input id="loginEmail" name="email" type="email" placeholder="Enter your registered email address" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div>
    <div class="form-options">
      <label class="remember"><input type="checkbox" id="remember" checked>Remember Me</label>
      <a class="forgot" href="forgot-password.html">Forgot Password?</a>
    </div>
    <button class="login-btn" id="loginButton" type="submit">Login to Your Account</button>
  </form>
  <p class="signup">Don't have an account? <a href="register.html">Create Account</a></p>
  <p class="notice" id="loginMessage" role="status" aria-live="polite">Sign in securely using your registered email address.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const loginForm=document.getElementById("loginForm");
const loginButton=document.getElementById("loginButton");
const loginMessage=document.getElementById("loginMessage");
function showLoginMessage(message,type=""){loginMessage.textContent=message;loginMessage.className=("notice "+type).trim();}
loginForm.addEventListener("submit",async function(event){
  event.preventDefault();
  if(typeof pvSupabase==="undefined"||!pvSupabase?.auth){
    showLoginMessage("Supabase could not be initialized. Please check supabase-config.js and the Supabase library connection.","error");return;
  }
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  if(!email||!password){showLoginMessage("Please enter your email address and password.","error");return;}
  loginButton.disabled=true;loginButton.textContent="Signing In...";
  showLoginMessage("Verifying your account. Please wait.");
  try{
    const {data,error}=await pvSupabase.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.user)throw new Error("Login could not be completed. Please try again.");
    showLoginMessage("Login successful. Opening product categories...","success");
    window.location.href="projects.html";
  }catch(error){
    let message=error?.message||"Login failed. Please check your details and try again.";
    if(/email not confirmed/i.test(message))message="Please verify your email address using the confirmation link sent to your inbox.";
    else if(/invalid login credentials/i.test(message))message="Incorrect email address or password. Please try again.";
    showLoginMessage(message,"error");loginButton.disabled=false;loginButton.textContent="Login to Your Account";
  }
});
</script>
</body>
</html>
