
<!DOCTYPE html>

<body>
  <main class="container">
    <h1>Reset Your Password</h1>

    <p class="subtitle">
      PVRajCMS Group<br>
      Crude Oil Scalp Calculator
    </p>

    <div id="resetForm" class="hidden">
      <form id="passwordForm">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="Enter new password"
          required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="Re-enter new password"
          required
        >

        <button id="submitBtn" type="submit">
          Update Password
        </button>
      </form>
    </div>

    <p id="message" role="status" aria-live="polite">
      Verifying your password reset link...
    </p>

    <a href="crude-oil-login.html">Back to Login</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://wgspejflgnjeikrytfob.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_B7_Of7lmeqKD980ik_-P6A_2JZbN8yc';

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          flowType: 'implicit',
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const resetForm = document.getElementById('resetForm');
    const passwordForm = document.getElementById('passwordForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? '#4ade80' : '#fca5a5';
    }

    async function checkResetSession() {
      try {
        const hashParams = new URLSearchParams(
          window.location.hash.substring(1)
        );

        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const type = hashParams.get('type');
        const hashError = hashParams.get('error_description');

        if (hashError) {
          throw new Error(hashError.replace(/\+/g, ' '));
        }

        if (type === 'recovery' && accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;

          // Remove tokens from the visible URL after session setup.
          history.replaceState(
            null,
            document.title,
            window.location.pathname + window.location.search
          );
        }

        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (data.session) {
          resetForm.classList.remove('hidden');
          showMessage(
            'Reset link verified. Enter your new password.',
            true
          );
        } else {
          throw new Error(
            'Reset link is invalid or expired. Please request a new reset email.'
          );
        }
      } catch (error) {
        showMessage(
          error.message || 'Could not verify reset link. Please request a new one.'
        );
      }
    }

    passwordForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const newPassword =
        document.getElementById('newPassword').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        showMessage('Password must contain at least 6 characters.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match. Please try again.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      showMessage('Updating your password...', true);

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error('Password update could not be confirmed.');
        }

        await supabase.auth.signOut();

        passwordForm.reset();
        resetForm.classList.add('hidden');

        showMessage(
          'Password updated successfully! You can now log in with your new password.',
          true
        );
      } catch (error) {
        showMessage(
          error.message || 'Password update failed. Please request a new reset link.'
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });

    checkResetSession();
  </script>
</body>
</html>
