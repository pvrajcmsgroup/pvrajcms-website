
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Reset Password | PVRajCMS Group</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b1220;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border: 1px solid #293a56;
      border-radius: 18px;
      background: #111d31;
      text-align: center;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 16px;
    }

    .brand {
      color: #b9c8df;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    #status {
      font-size: 14px;
      line-height: 1.7;
      margin: 18px 0;
      overflow-wrap: anywhere;
    }

    .error { color: #ff9292; }
    .success { color: #80edb0; }

    form { text-align: left; }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40516d;
      border-radius: 8px;
      background: #0b1220;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #16b8e8;
      color: #06121e;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #55d6ff;
      text-decoration: none;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset Your Password</h1>

    <div class="brand">
      PVRajCMS Group<br>
      Crude Oil Scalp Calculator
    </div>

    <p id="status" role="status" aria-live="polite">
      Verifying your password reset link...
    </p>

    <form id="resetForm" class="hidden">
      <label for="password">New Password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter new password"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Re-enter new password"
        required
      >

      <button id="submitButton" type="submit">
        Update Password
      </button>
    </form>

    <a class="back"
       href="https://pvrajcmsgroup.github.io/pvrajcms-website/crude-oil-login.html">
      Back to Login
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const form = document.getElementById("resetForm");
      const submitButton = document.getElementById("submitButton");

      function showStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = type;
      }

      function showError(message) {
        showStatus(message, "error");
      }

      if (!window.supabase) {
        showError("Unable to load the security service. Please refresh the page.");
        return;
      }

      // Create the Supabase client only once in this file.
      const resetClient = window.supabase.createClient(
        "https://wgspejflgnjeikrytfob.supabase.co",
        "sb_publishable_B7_Of7lmeqKD980ik_-P6A_2JZbN8yc",
        {
          auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );

      try {
        // Detect an expired or invalid link before showing the form.
        const currentUrl = new URL(window.location.href);
        const hashParams = new URLSearchParams(
          currentUrl.hash.replace(/^#/, "")
        );

        const urlError =
          currentUrl.searchParams.get("error_description") ||
          hashParams.get("error_description");

        const errorCode =
          currentUrl.searchParams.get("error_code") ||
          hashParams.get("error_code");

        if (urlError || errorCode) {
          showError(
            errorCode === "otp_expired"
              ? "This password reset link has expired or was already used. Please return to Login and request a new reset email."
              : "This reset link is invalid. Please request a new password reset email."
          );
          return;
        }

        // Allow Supabase to process the callback and retrieve the session.
        const { data, error } = await resetClient.auth.getSession();

        if (error) {
          showError("Could not verify the reset link. Please request a new one.");
          return;
        }

        if (!data.session) {
          showError(
            "No valid reset session found. Please request a new password reset email and open its latest link."
          );
          return;
        }

        showStatus("Reset link verified. Enter your new password.");
        form.classList.remove("hidden");

      } catch (err) {
        console.error("Password reset initialization error:", err);
        showError("Something went wrong while verifying the link. Please request a new reset email.");
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 8) {
          showError("Password must contain at least 8 characters.");
          return;
        }

        if (password !== confirmPassword) {
          showError("Both passwords do not match.");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Updating...";
        showStatus("Updating your password...");

        try {
          const { error } = await resetClient.auth.updateUser({
            password: password
          });

          if (error) {
            console.error("Password update error:", error);
            showError(error.message);
            return;
          }

          showStatus(
            "Password updated successfully! Redirecting to Login...",
            "success"
          );

          await resetClient.auth.signOut();

          setTimeout(function () {
            window.location.href =
              "https://pvrajcmsgroup.github.io/pvrajcms-website/crude-oil-login.html";
          }, 1800);

        } catch (err) {
          console.error("Password update error:", err);
          showError("Could not update your password. Please try again.");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Update Password";
        }
      });
    })();
  </script>
</body>
</html>
