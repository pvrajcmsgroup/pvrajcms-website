<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAS PCS Prelims | PV Education</title>

<style>
:root{
--navy:#06172a;
--blue:#087bd8;
--cyan:#18c4e8;
--ink:#10213b;
--muted:#607087;
--bg:#f4f8fc;
--line:#dce7f1;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--ink)
}
a{text-decoration:none;color:inherit}
.topbar{
background:var(--navy);
color:white;
position:sticky;
top:0;
z-index:10
}
.nav{
max-width:1200px;
margin:auto;
min-height:74px;
padding:10px 18px;
display:flex;
align-items:center;
gap:16px
}
.brand{
display:flex;
align-items:center;
gap:12px;
font-weight:800
}
.brand-mark{
width:44px;
height:44px;
border-radius:12px;
background:linear-gradient(135deg,var(--blue),var(--cyan));
display:grid;
place-items:center;
font-size:23px
}
.brand-text small{
display:block;
font-size:10px;
letter-spacing:1.3px;
color:#9feaff;
margin-top:5px
}
.navlinks{
margin-left:auto;
display:flex;
gap:20px;
font-size:13px;
font-weight:bold
}
.navlinks a:hover{color:#75e4f8}
.mobile-menu{
display:none;
background:transparent;
color:white;
border:1px solid #54718a;
border-radius:8px;
padding:8px 12px
}
.hero{
background:linear-gradient(115deg,#06172a,#0b3456 60%,#087a9a);
color:white;
padding:36px 18px
}
.hero-inner{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:28px
}
.hero h1{
font-size:clamp(30px,4vw,43px);
margin:12px 0
}
.eyebrow{
display:inline-block;
background:#0e4963;
border:1px solid #267b9a;
border-radius:30px;
padding:7px 12px;
color:#8eeaff;
font-size:11px;
letter-spacing:1px;
font-weight:800
}
.hero p{
max-width:700px;
color:#d5e7f6;
line-height:1.6
}
.hero-art{font-size:86px;text-align:center}
.container{
max-width:1200px;
margin:30px auto;
padding:0 18px
}
.section-title{margin-bottom:20px}
.section-title h2{margin:0;font-size:25px}
.section-title p{color:var(--muted)}
.cards{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:18px
}
.exam-card{
background:white;
border:1px solid var(--line);
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 24px #0b345608
}
.card-head{
background:linear-gradient(110deg,#09243d,#075b93);
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center
}
.paper-tag{
font-size:11px;
font-weight:800;
letter-spacing:1px;
color:#a7edff
}
.card-head h3{margin:7px 0 0;font-size:22px}
.badge{
border-radius:30px;
padding:7px 11px;
background:#ffffff20;
border:1px solid #ffffff30;
font-size:11px
}
.card-body{padding:20px}
.details{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
.detail{
background:#f5f9fc;
border:1px solid #e3edf5;
border-radius:11px;
padding:12px;
margin-top:8px;
min-width:0
}
.detail small{
display:block;
color:var(--muted);
font-size:11px;
margin-bottom:5px
}
.detail strong{
font-size:14px;
display:block;
overflow-wrap:anywhere
}
.notice{
background:#fff8e8;
border:1px solid #f1dfb5;
color:#765416;
border-radius:11px;
padding:12px;
margin:14px 0;
font-size:12px;
line-height:1.5
}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;
border:0;
border-radius:10px;
padding:11px 16px;
font-weight:700;
font-size:14px;
cursor:pointer;
text-align:center
}
.primary{background:var(--blue);color:white}
.secondary{
background:#eaf4fc;
color:#075b93;
border:1px solid #d1e4f3
}
.card-actions{
display:flex;
gap:10px;
margin-top:14px;
flex-wrap:wrap
}
.card-actions .btn{flex:1}
.info-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:26px
}
.info{
background:white;
border:1px solid var(--line);
border-radius:14px;
padding:18px
}
.info h4{margin:10px 0 6px}
.info p{
margin:0;
color:var(--muted);
font-size:13px;
line-height:1.5
}
footer{
margin-top:40px;
background:var(--navy);
color:#d5e4f1;
padding:22px 18px
}
.foot{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
font-size:13px
}
.modal{
position:fixed;
inset:0;
background:#06172acc;
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:50
}
.modal.open{display:flex}
.modal-box{
background:white;
width:min(100%,900px);
max-height:92vh;
overflow:auto;
border-radius:16px;
padding:22px;
box-shadow:0 20px 60px #0004
}
.modal-box h2{margin-top:0}
.modal-box p{
color:var(--muted);
font-size:13px;
line-height:1.5
}
.modal-box input{
width:100%;
padding:12px;
border:1px solid var(--line);
border-radius:9px;
margin:7px 0;
font:inherit
}
.modal-box label{
display:block;
font-size:12px;
font-weight:700;
margin-top:8px
}
.modal-actions{
display:flex;
gap:10px;
margin-top:12px
}
.modal-actions button{flex:1}
.close{
float:right;
border:0;
background:#eef3f8;
border-radius:8px;
padding:7px 10px;
cursor:pointer
}
.admin-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:14px
}
.admin-section{
border:1px solid var(--line);
border-radius:12px;
padding:14px;
min-width:0
}
.upload-status{
display:block;
min-height:20px;
margin:10px 0 0;
padding:8px;
border-radius:8px;
background:#f0f8ff;
color:#075b93;
font-size:12px;
line-height:1.45;
overflow-wrap:anywhere
}
.upload-preview{
margin-top:8px;
padding:10px;
background:#f0f8ff;
border-radius:8px;
font-size:12px;
overflow-wrap:anywhere;
word-break:break-word
}
.admin-section input[type=file]{
max-width:100%;
width:100%
}
.admin-section button{
max-width:100%;
white-space:normal;
margin-top:5px
}
table{
width:100%;
border-collapse:collapse;
min-width:700px
}
th,td{
padding:12px;
border-bottom:1px solid var(--line);
text-align:left
}
th{background:#eaf4fc}
.student-dashboard{
background:white;
border:1px solid var(--line);
border-radius:18px;
padding:20px;
box-shadow:0 8px 24px #0b345608
}
.student-paper{
border:1px solid var(--line);
border-radius:14px;
overflow:hidden;
background:white
}
.student-paper-body{padding:18px}
.student-file-status{
padding:12px;
background:#f5f9fc;
border:1px solid #e3edf5;
border-radius:10px;
margin:10px 0;
overflow-wrap:anywhere
}
.hidden{display:none!important}
@media(max-width:800px){
.navlinks{
display:none;
position:absolute;
top:74px;
left:0;
right:0;
background:var(--navy);
padding:18px;
flex-direction:column
}
.navlinks.open{display:flex}
.mobile-menu{display:block;margin-left:auto}
.hero-inner{flex-direction:column;align-items:flex-start}
.cards{grid-template-columns:1fr}
.info-grid{grid-template-columns:1fr}
.admin-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
.nav{padding:9px 12px}
.hero{padding:27px 15px}
.container{padding:0 13px}
.card-head{padding:16px}
.card-head h3{font-size:19px}
.card-body{padding:15px}
.details{grid-template-columns:1fr 1fr}
.card-actions{flex-direction:column}
.card-actions .btn{width:100%}
}
</style>
