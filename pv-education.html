<!-- PV EDUCATION ONLINE EXAMINATION PORTAL -->
<section class="page-section" id="exams">

<style>
/* ===== PV EDUCATION EXAM PORTAL ===== */

#exams,
#exams *{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif !important;
}

#exams{
    background:#f4f8fc;
    padding:24px 15px 28px;
    color:#10213b;
}

.exam-container{
    width:100%;
    max-width:1000px;
    margin:0 auto;
}

/* ===== PORTAL HEADER ===== */

.exam-header{
    position:relative;
    overflow:hidden;
    background:linear-gradient(110deg,#06172a,#0b3456 60%,#087a9a);
    color:#fff;
    border-radius:15px;
    padding:24px 26px;
}

.exam-header::after{
    content:"";
    position:absolute;
    right:-75px;
    top:-100px;
    width:220px;
    height:220px;
    border-radius:50%;
    background:#18c4e8;
    opacity:.10;
    pointer-events:none;
}

.exam-brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
    color:#8eeaff;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
}

.exam-logo{
    display:flex;
    align-items:center;
    justify-content:center;
    width:35px;
    height:35px;
    flex-shrink:0;
    background:#0e4963;
    border:1px solid #2b8eb1;
    border-radius:9px;
    font-size:18px;
}

.exam-header h1{
    margin:0 0 9px;
    color:#fff;
    font-size:30px;
    font-weight:800;
    line-height:1.25;
}

.exam-header p{
    margin:0;
    max-width:720px;
    color:#d5e7f6;
    font-size:14px;
    line-height:1.6;
}

/* ===== EXAM CARD ===== */

.exam-card-wrapper{
    margin-top:15px;
}

.exam-card{
    background:#fff;
    border:1px solid #dce7f1;
    border-radius:13px;
    padding:22px;
    box-shadow:0 4px 14px rgba(15,45,75,.035);
}

.exam-card h2{
    margin:0 0 8px;
    color:#10213b;
    font-size:20px;
    font-weight:800;
}

.exam-card p{
    margin:0 0 18px;
    color:#607087;
    font-size:14px;
    line-height:1.65;
}

/* ===== BUTTON ===== */

.exam-enter-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#087bd8;
    color:#fff !important;
    text-decoration:none !important;
    border:1px solid #087bd8;
    border-radius:9px;
    padding:13px 22px;
    font-size:14px;
    font-weight:800;
    transition:all .2s ease;
}

.exam-enter-button:hover{
    background:#006ac0;
    border-color:#006ac0;
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(8,123,216,.20);
}

.exam-enter-button:active{
    transform:translateY(0);
}

/* ===== DESKTOP ===== */

@media(min-width:768px){

    #exams{
        padding:28px 20px 32px;
    }

    .exam-header{
        padding:25px 28px;
    }

    .exam-card{
        padding:24px;
    }

}

/* ===== MOBILE ===== */

@media(max-width:767px){

    #exams{
        padding:15px 11px 20px;
    }

    .exam-header{
        padding:20px 17px;
        border-radius:12px;
    }

    .exam-brand{
        font-size:10px;
        letter-spacing:.6px;
        margin-bottom:11px;
    }

    .exam-logo{
        width:32px;
        height:32px;
        font-size:16px;
    }

    .exam-header h1{
        font-size:24px;
        margin-bottom:8px;
    }

    .exam-header p{
        font-size:13px;
        line-height:1.6;
    }

    .exam-card-wrapper{
        margin-top:12px;
    }

    .exam-card{
        padding:18px 15px;
        border-radius:12px;
    }

    .exam-card h2{
        font-size:18px;
    }

    .exam-card p{
        font-size:13px;
        margin-bottom:16px;
    }

    .exam-enter-button{
        width:100%;
        padding:14px 15px;
        font-size:14px;
    }

}

/* ===== SMALL MOBILE ===== */

@media(max-width:380px){

    .exam-header h1{
        font-size:22px;
    }

    .exam-brand{
        font-size:9px;
    }

    .exam-card{
        padding:16px 13px;
    }

}
</style>

        <p>

        </p>

    </div>

    <!-- EXAMINATION -->
    <div class="exam-card-wrapper">

        <div class="exam-card">

            <h2>Online Examination</h2>

            <p>
                Access your examination and attempt the question paper.
            </p>

            <a href="online-exam.html" class="exam-enter-button">
                Enter Online Examination →
            </a>

        </div>

    </div>

</div>

</section>
